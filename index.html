<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face à Soi</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .btn { background: #e11d48; padding: 20px 40px; border-radius: 15px; font-size: 20px; font-weight: bold; border: none; color: white; cursor: pointer; }
        #rescue { display: none; font-size: 40px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="home">
        <button class="btn" onclick="startRescue()">Arrêt (90s)</button>
    </div>

    <div id="rescue">
        <span id="timer">90</span>
    </div>

    <script>
        function startRescue() {
            document.getElementById('home').style.display = 'none';
            document.getElementById('rescue').style.display = 'block';
            let t = 90;
            const timer = document.getElementById('timer');
            const interval = setInterval(() => {
                t--;
                timer.innerText = t;
                if(t <= 0) {
                    clearInterval(interval);
                    alert("Fin du sas.");
                    location.reload();
                }
            }, 1000);
        }
    </script>
</body>
</html>
