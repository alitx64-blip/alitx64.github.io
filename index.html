<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Face à Soi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { darkBg: '#09090b', accentViolet: '#6366f1', accentRose: '#f43f5e', accentEmerald: '#10b981' } } } }
    </script>
    <style>
        body { -webkit-tap-highlight-color: transparent; user-select: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.6); opacity: 1; } }
        .breathe-circle { animation: breathe 8s infinite ease-in-out; }
    </style>
</head>
<body class="bg-darkBg text-zinc-100 min-h-screen">
    <div class="w-full max-w-md mx-auto min-h-screen flex flex-col bg-zinc-950 border-x border-zinc-900 pb-20">
        <header class="p-4 border-b border-zinc-900 flex justify-between items-center">
            <h1 class="text-lg font-bold">Face à Soi</h1>
        </header>

        <main class="flex-1 p-4 overflow-y-auto no-scrollbar">
            <!-- ACCUEIL -->
            <section id="accueil" class="space-y-6">
                <div class="bg-zinc-900 p-5 rounded-2xl border border-zinc-800 text-center space-y-4">
                    <h2 class="text-xl font-bold">Une pulsion de fuite ?</h2>
                    <p class="text-zinc-400 text-sm">90 secondes de respiration pour ne plus subir l'anesthésie.</p>
                    <button onclick="lancerRespiration()" class="w-full py-4 bg-accentRose rounded-xl font-bold">Lancer l'arrêt (90s)</button>
                </div>
            </section>

            <!-- ZONE RESCUE -->
            <section id="rescue" class="hidden flex flex-col items-center justify-center py-20">
                <div id="breathe-ring" class="w-36 h-36 bg-accentRose rounded-full breathe-circle flex items-center justify-center">
                    <span class="text-3xl font-black" id="timer">90</span>
                </div>
            </section>
        </main>

        <nav class="fixed bottom-0 w-full max-w-md bg-zinc-950 border-t border-zinc-900 h-16 flex justify-around items-center">
            <button onclick="document.location.reload()" class="text-xs">Accueil</button>
        </nav>
    </div>

    <script>
        function lancerRespiration() {
            document.getElementById('accueil').classList.add('hidden');
            document.getElementById('rescue').classList.remove('hidden');
            let t = 90;
            const timerEl = document.getElementById('timer');
            const interval = setInterval(() => {
                t--;
                timerEl.innerText = t;
                if(t <= 0) {
                    clearInterval(interval);
                    alert("Le pic est passé. Tu es aux commandes.");
                    window.location.reload();
                }
            }, 1000);
        }
    </script>
</body>
</html>
