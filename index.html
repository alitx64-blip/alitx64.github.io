<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Face à Soi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #09090b; color: #e4e4e7; font-family: sans-serif; }
        .breathe { animation: breathe 8s infinite ease-in-out; }
        @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.4); } }
    </style>
</head>
<body class="p-4">
    <div class="max-w-md mx-auto space-y-6">
        <h1 class="text-2xl font-bold border-b border-zinc-800 pb-2">Face à Soi</h1>

        <!-- ECRAN ACCUEIL -->
        <div id="home">
            <button onclick="startRescue()" class="w-full py-6 bg-rose-600 rounded-xl font-bold text-lg mb-6">Lancer l'arrêt (90s)</button>
            <h2 class="text-xs uppercase text-zinc-500 font-bold tracking-widest mb-4">Mes Anesthésiants</h2>
            <div id="catalog" class="grid grid-cols-2 gap-2"></div>
        </div>

        <!-- ECRAN RESCUE -->
        <div id="rescue" class="hidden text-center py-10 space-y-8">
            <div id="ring" class="w-40 h-40 bg-rose-500 rounded-full mx-auto flex items-center justify-center breathe">
                <span id="timer" class="text-5xl font-bold">90</span>
            </div>
            <p class="text-zinc-400">Surfez la vague. L'émotion passera en 90 secondes.</p>
        </div>

        <!-- ECRAN JOURNAL -->
        <div id="journal" class="hidden space-y-4">
            <h2 class="text-xl font-bold">Qu'est-ce qui se cache dessous ?</h2>
            <textarea id="note" class="w-full h-32 bg-zinc-900 border border-zinc-800 rounded-lg p-4" placeholder="Écrivez votre vérité brute ici..."></textarea>
            <button onclick="saveNote()" class="w-full py-4 bg-indigo-600 rounded-xl font-bold">Enregistrer l'exploration</button>
        </div>
    </div>

    <script>
        const items = ["Sexe/Porno", "Alcool", "Boulimie", "Sport excessif", "Scroll infini", "Workaholisme", "Achats", "Colère/Conflit"];
        
        // Affichage catalogue
        const cat = document.getElementById('catalog');
        items.forEach(i => cat.innerHTML += `<div class="p-3 bg-zinc-900 border border-zinc-800 rounded-lg text-xs font-medium text-center">${i}</div>`);

        function startRescue() {
            document.getElementById('home').classList.add('hidden');
            document.getElementById('rescue').classList.remove('hidden');
            let t = 90;
            const timer = document.getElementById('timer');
            const interval = setInterval(() => {
                t--;
                timer.innerText = t;
                if(t <= 0) {
                    clearInterval(interval);
                    document.getElementById('rescue').classList.add('hidden');
                    document.getElementById('journal').classList.remove('hidden');
                }
            }, 1000);
        }

        function saveNote() {
            const note = document.getElementById('note').value;
            alert("Enregistré : " + note);
            location.reload();
        }
    </script>
</body>
</html>
